name: GPT Signal Scanner

on:
  schedule:
    - cron: "30 21 * * *"  # 매일 06:30 KST
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run GPT Signal Scanner
        run: |
          python gpt_app.py