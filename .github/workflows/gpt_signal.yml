name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit App
        run: |
          curl -L --max-time 60 -s -o /dev/null -w "%{http_code}\n" https://quant-signal.streamlit.app